<form (ngSubmit)="onSubmitMyForm()" action="">

    <div class="input-group">
        <p>
            <label for="initial-investment">
                Initial Investment
                 <input 
                 name="initial-investment"
                 id="initial-investment"  
                 type="number" 
                 [(ngModel)]="enteredInitialInvestment"/>
            </label>
        </p>
        <p>
            <label for="annual-investment">
            Annual Investment
                <input id="annual-investment"
                name="annual-investment" 
                 type="number"
                 [(ngModel)]="enteredAnnualInvestment"/>
            </label>
        </p>
    </div>
        <div class="input-group">
        <p>
            <label for="expected-return">
                Expected Return
                 <input id="expected-return" 
                 name="expected-return"
                  type="number"
                 [(ngModel)]="enteredReturnValue"/>
            </label>
        </p>
        <p>
            <label for="duration">
            Duration
                <input id="duration" 
                name="duration"  type="number"
                [(ngModel)]="enteredDuration"/>
            </label>
        </p>
    </div>
    <p>
        <button type="submit">Calculate</button>
    </p>
</form>
